<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura & Elegance — Curated Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Ambient Background Lighting Gradients -->
    <div class="ambient-glow"></div>
    <div class="ambient-glow-2"></div>

    <!-- Cinematic Entry Loader -->
    <div id="loader">
        <div class="loader-brand">AURA & ELEGANCE</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- Main Webpage Structure -->
    <div class="page-wrapper">
        <header>
            <span class="header-tag">Curated Visual Archive</span>
            <h1>Timeless Radiance</h1>
            <p>An immersive showcase of high-end aesthetics, graceful frames, and charming whispers captured in absolute clarity.</p>
        </header>

        <main class="masonry-grid" id="galleryGrid">
            <!-- Cards will be dynamically injected via JavaScript for modularity -->
        </main>

        <footer>
            <p>&copy; 2026 Aura & Elegance Gallery. Engineered for 60 FPS fluid perfection.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
